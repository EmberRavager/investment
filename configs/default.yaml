# 默认配置：所有字段均可自由调整
data:
  symbol: "600519"        # 贵州茅台；指数示例: kind=index symbol=000300
  kind: stock             # stock | index
  market: sh
  start: "2018-01-01"
  end: ""                 # 留空 = 到今天（始终包含最新数据）
  adjust: qfq             # qfq / hfq / ""
  cache_dir: data/cache
  use_cache: true

features:
  indicators: [returns, sma, ema, rsi, macd, atr, bollinger, obv, roc, volume]
  windows: [5, 10, 20, 60]
  dropna: true

labels:
  horizon: 1              # 预测未来 1 个交易日方向
  threshold: 0.0
  method: direction

model:
  name: xgboost           # 见 `python run.py --list-models`
  scale: false
  params:
    n_estimators: 400
    max_depth: 4
    learning_rate: 0.05

backtest:
  train_window: 500
  min_train: 250
  retrain_every: 20
  embargo: 0              # 0 表示自动取 labels.horizon
  prob_threshold: 0.50
  # 稳定优先的风控层
  trend_filter: true      # 仅在上行趋势中做多
  trend_ma: 200
  vol_target: 0.10        # 年化目标波动率
  vol_lookback: 20
  max_position: 1.0
  min_hold: 20            # 最少持有天数，降低换手
  drawdown_stop: 0.15     # 回撤熔断阈值
  drawdown_cooldown: 20   # 熔断后空仓天数
  cost:
    commission: 0.00025
    stamp_tax: 0.0005
    slippage: 0.0005

output:
  dir: outputs/default
  plot: true
  save_predictions: true
  save_model: true
