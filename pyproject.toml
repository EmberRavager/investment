[project]
name = "ashare-pred"
version = "0.1.0"
description = "轻量级 A 股量化预测系统：数据 → 特征 → 可插拔模型 → 滚动回测"
requires-python = ">=3.10,<3.14"
dependencies = [
    "akshare>=1.14",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "ta>=0.11",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
include = ["ashare_pred*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
